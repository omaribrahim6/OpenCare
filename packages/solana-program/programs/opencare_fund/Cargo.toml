[package]
name = "opencare_fund"
version = "0.1.0"
description = "OpenCare community fund rules on Solana devnet"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "opencare_fund"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "0.31.1"

[lints.rust]
unexpected_cfgs = { level = "allow" }
